serviceTree:
  landscape: lapras
  platform: nitroso
  service: dotnet
  module: api

replicaCount: 1

# -- Rolling update strategy. Defaults to surge-not-shrink so a sync never
# drops below the desired replica count.
rollingUpdate:
  # -- Max pods that may be unavailable during a rollout
  maxUnavailable: 0
  # -- Max pods that may be created above the desired count during a rollout
  maxSurge: 1

aspNetEnv: Development

appSettings:
  App:
    Mode: Server

configMountPath: /app/App/Config

image:
  repository: dotnet-chart
  pullPolicy: IfNotPresent
  tag: ''

imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''

serviceAccount:
  create: false
  annotations: {}
  name: ''

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 80
  containerPort: 9000

ingress:
  enabled: false
  className: 'traefik'
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}

autoscaling: {}

readinessProbe: {}

livenessProbe: {}

nodeSelector: {}

tolerations: []

affinity: {}

topologySpreadConstraints: {}
